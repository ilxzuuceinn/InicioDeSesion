<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/logo navbar.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Glance
            </a>
        </div>
    </nav>

    <div class="imagenlogo">
        <img src="img/logo.jpg" alt="Logo" width="200px" height="200px" id="imagenlogo">
    </div>
    <div class="primera">
        <div class="segundo">
            <h1>Crear cuenta</h1>
            <center>
                <p>Cree su cuenta para guardar sus datos :3</p>
                <input type="text" id="nuevoUsuario" placeholder="Crear usuario">
                <br>
                <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">
                <br>
                <button onclick="registrar()">Registrarse</button>
                <p id="mensaje1"></p>
            </center>
        </div>


        <div class="principal">
            <h1>Inicio de Sesión</h1>
            <center>
                <p>Ingrese su usuario y contraseña para poder continuar :O</p>
                <input type="text" id="usuario" placeholder="Nombre de usuario">
                <br>
                <input type="password" id="contrasena" placeholder="Contraseña">
                <br>
                <button onclick="iniciarSesion()">Iniciar Sesión</button>
                <p id="mensaje2"></p>
            </center>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
