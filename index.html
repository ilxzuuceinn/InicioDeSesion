<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>
<body>
   <center><img class="imagenlogo" src="img/logo.jpg" alt="Logo" width="200px" height="200px"></center>
    <div class="principal">
        <h1>Inicio de Sesión</h1>
        <input type="text" id="usuario" placeholder="Nombre de usuario">
        <button onclick="inicio()">Validar Usuario</button>
        <p id="resultado"></p>
    </div>


    // Registro uwu
    <div class="contenedor">

        <h1>Crear cuenta</h1>

        <input type="text" id="nuevoUsuario" placeholder="Crear usuario">

        <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">

        <button onclick="registrar()">Registrarse</button>

        <p id="mensaje"></p>

        <button onclick="location.href='login.html'">
            Ya tengo una cuenta
        </button>

    </div>


    // Inicio de sesion jej
    <div class="contenedor">

        <h1>¡Bienvenido Usuario!</h1>

        <p id="usuario"></p>

        <p>¡Has iniciado sesión!</p>

        <button onclick="cerrarSesion()">
            Cerrar tu sesión
        </button>
    </div>
</body>
</html>
