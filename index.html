<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>
<body>
   <center><img class="imagenlogo" src="img/logo.jpg" alt="Logo" width="200px" height="200px"></center>
    
   <div class="primera">
        <div class="segundo">
            <h1>Crear cuenta</h1>
            <input type="text" id="nuevoUsuario" placeholder="Crear usuario">
            <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">
            <button onclick="registrar()">Registrarse</button>
            <p id="mensaje"></p>
        </div>


        <div class="principal">
            <h1>Inicio de Sesión</h1>
            <p>Ingrese su usuario y contraseña para poder continuar</p>
            <input type="text" id="usuario" placeholder="Nombre de usuario">
            <input type="password" id="contrasena" placeholder="Contraseña">
            <button onclick="iniciarSesion()">Iniciar Sesión</button>
            <p id="mensaje"></p>
        </div>
    </div>
</body>
</html>
